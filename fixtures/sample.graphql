"""Sample GraphQL SDL schema for SchemaForge testing."""
type Query {
  user(id: ID!): User
  users: [User!]!
  posts: [Post!]!
}

type Mutation {
  createUser(input: CreateUserInput!): User!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  deleteUser(id: ID!): Boolean!
}

enum Role {
  ADMIN
  USER
  MODERATOR
  GUEST
}

enum PostStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

type User {
  id: ID!
  name: String!
  email: String! @unique
  age: Int
  role: Role!
  createdAt: DateTime!
  updatedAt: DateTime
  posts: [Post!]!
  profile: JSON
}

type Post {
  id: ID!
  title: String!
  content: String!
  author: User!
  status: PostStatus!
  publishedAt: DateTime
  tags: [String!]
  views: Int @default(0)
}

input CreateUserInput {
  name: String!
  email: String!
  age: Int
  role: Role!
}

input UpdateUserInput {
  name: String
  email: String
  age: Int
  role: Role
}
